services:
  # n8n: workflow 01 (ส่งอีเมลแจ้งเตือน R1/R2) และ 02 (อีเมลขาเข้า + webhook re-forward)
  n8n:
    build:
      context: .
      dockerfile: Dockerfile
    image: custom-n8n-email-automation:latest
    container_name: n8n_auto_email
    restart: always
    # ผูกกับ 127.0.0.1 เท่านั้น: เข้า editor ผ่าน SSH tunnel (ssh -L 5678:127.0.0.1:5678 ...)
    # ห้ามเปิด 0.0.0.0 เพราะ n8n รันโค้ดได้ และหน้า owner setup ครั้งแรกให้ใครก็ได้สร้างบัญชี
    ports:
      - "127.0.0.1:${N8N_PORT:-5678}:5678"
    env_file:
      - .env
    environment:
      - GENERIC_TIMEZONE=${GENERIC_TIMEZONE:-Asia/Bangkok}
      - TZ=${TZ:-Asia/Bangkok}
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY}
    volumes:
      - ./n8n_data:/home/node/.n8n
      - ./local-files:/files

  # เว็บจัดการระบบ (sheets-app): หน้าเว็บ + API ใน container เดียว
  # ค่าลับอ่านจาก sheets-app/server/.env (SPREADSHEET_ID, Service Account, IMAP) ไม่มีไฟล์ก็ยังเริ่มได้แต่จะต่อ Google Sheets ไม่ได้
  # ชีต config: n8n_webhook_url ควรเป็น http://n8n:5678/webhook/re-forward (เรียกกันภายใน network ของ compose)
  web:
    build:
      context: ./sheets-app
      dockerfile: Dockerfile
    image: automail-insurance-web:latest
    container_name: automail_web
    restart: always
    # ผูกกับ 127.0.0.1 เท่านั้น: ภายนอกเข้าผ่าน reverse proxy (Caddy) ห้ามเปิด 0.0.0.0 เพราะ Docker ข้ามกฎ ufw
    # และ login ของแอปใช้แค่อีเมล (ดู docs/sessions/2026-11-12-vps-setup.md)
    ports:
      - "127.0.0.1:${WEB_PORT:-5000}:5000"
    env_file:
      - path: ./sheets-app/server/.env
        required: false
    environment:
      - PORT=5000
    depends_on:
      - n8n
